---
profile: production
exclude_paths:
  - .*
  - .github/
  - mkdocs.yml
  - openspec/
  - ~/.ansible/
skip_list:
  - yaml  # yamllint runs as part of pre-commit
enable_list:
  - args
  - empty-string-compare # opt-in
  - no-log-password # opt-in
  - no-same-owner # opt-in
  - name[prefix] # opt-in
  - galaxy-version-incorrect # opt-in
strict: true
verbosity: 1
