dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    upgrade: true
driver:
  name: podman
platforms:
  - name: ${TOX_ENV_NAME:-instance}
    registry:
      url: ${REGISTRY_URL:-registry.fedoraproject.org}
    image: fedora:${IMAGE_TAG:-latest}
    # dockerfile: ../_resources/Containerfile.j2
    # command: ${CONTAINER_CMD:-/lib/systemd/systemd}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    tmpfs:
      - /run
      - /tmp
    capabilities:
      - SYS_ADMIN
    # cgroupns_mode: host
    privileged: false
    pre_build_image: false
    groups: [molecule]
provisioner:
  name: ansible
  log: true
  # inventory:
  #   group_vars:
  #     molecule:
  #       ansible_user: ubuntu
  env:
    ANSIBLE_CONFIG: ansible.cfg
verifier:
  name: testinfra
  options:
    junitxml: ${JUNIT_OUTPUT_DIR:-.ansible.log}/report.xml
lint: ansible-lint .
