[defaults]
# Files in /tmp are not persistent, assuming it uses a memory-backed fs
remote_tmp                = /tmp
result_format             = yaml
callbacks_enabled         = junit, ansible.posix.profile_tasks, ansible.posix.profile_roles, ansible.posix.timer, community.general.yaml
stdout_callback           = community.general.yaml
interpreter_python        = auto_silent
display_args_to_stdout    = true
display_failed_stderr     = true
display_ok_hosts          = false
show_task_path_on_failure = true
display_skipped_hosts     = no
forks                     = 50
verbosity                 = 2

[ssh_connection]
scp_if_ssh = True
control_path = %(directory)s/%%h-%%p-%%r

# collections_path is typically for playbook projects, not collection development
# Uncomment if needed for testing collection locally before installation
# collections_paths = .
