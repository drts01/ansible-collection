---
# Molecule configuration for fedora_minimal role testing
# Tests Fedora 43+ baseline configuration role with CIS benchmark alignment

dependency:
  name: galaxy

driver:
  name: podman

platforms:
  - name: fedora43
    image: registry.fedoraproject.org/fedora:43
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rshared
    cgroupns_mode: host
    command: /sbin/init
    capabilities:
      - SYS_ADMIN

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        ansible_python_interpreter: /usr/bin/python3

scenario:
  name: fedora_minimal
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
