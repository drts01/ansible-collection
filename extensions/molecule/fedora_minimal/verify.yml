---
# Verify playbook for fedora_minimal role testing
# Validates that the role has been correctly applied

- name: Verify fedora_minimal role
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # ========================================================================
    # Package Installation Verification
    # ========================================================================

    - name: Verify essential packages are installed
      ansible.builtin.package_facts:
        manager: auto

    - name: Check vim-enhanced package
      ansible.builtin.assert:
        that:
          - '''vim-enhanced'' in ansible_facts.packages'
        fail_msg: vim-enhanced package not installed
        success_msg: vim-enhanced package verified installed

    - name: Check git package
      ansible.builtin.assert:
        that:
          - '''git'' in ansible_facts.packages'
        fail_msg: git package not installed
        success_msg: git package verified installed

    - name: Check curl package
      ansible.builtin.assert:
        that:
          - '''curl'' in ansible_facts.packages'
        fail_msg: curl package not installed
        success_msg: curl package verified installed

    - name: Check aide package
      ansible.builtin.assert:
        that:
          - '''aide'' in ansible_facts.packages'
        fail_msg: aide package not installed
        success_msg: aide package verified installed

    # ========================================================================
    # System Services Verification
    # ========================================================================

    - name: Verify chronyd service is enabled and running
      ansible.builtin.service_facts: {}

    - name: Check chronyd is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['chronyd.service']['state'] == 'running'
          - ansible_facts.services['chronyd.service']['enabled']
        fail_msg: chronyd service is not running or not enabled
        success_msg: chronyd service verified running and enabled

    - name: Check rsyslog is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['rsyslog.service']['state'] == 'running'
          - ansible_facts.services['rsyslog.service']['enabled']
        fail_msg: rsyslog service is not running or not enabled
        success_msg: rsyslog service verified running and enabled

    # ========================================================================
    # SSH Configuration Verification
    # ========================================================================

    - name: Verify SSH configuration file exists
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: sshd_config_stat

    - name: Check SSH config exists
      ansible.builtin.assert:
        that:
          - sshd_config_stat.stat.exists
          - sshd_config_stat.stat.mode == '0600'
        fail_msg: sshd_config doesn't exist or has wrong permissions
        success_msg: sshd_config exists with correct permissions (0600)

    - name: Verify SSH root login disabled
      ansible.builtin.command:
        cmd: grep "^PermitRootLogin no" /etc/ssh/sshd_config
      changed_when: false
      failed_when: false
      register: ssh_root_login_check

    - name: Check SSH root login is disabled
      ansible.builtin.assert:
        that:
          - ssh_root_login_check.rc == 0
        fail_msg: SSH root login is not disabled
        success_msg: SSH root login verified disabled

    - name: Verify SSH password authentication disabled
      ansible.builtin.command:
        cmd: grep "^PasswordAuthentication no" /etc/ssh/sshd_config
      changed_when: false
      failed_when: false
      register: ssh_password_auth_check

    - name: Check SSH password authentication is disabled
      ansible.builtin.assert:
        that:
          - ssh_password_auth_check.rc == 0
        fail_msg: SSH password authentication is not disabled
        success_msg: SSH password authentication verified disabled

    # ========================================================================
    # File Permissions Verification
    # ========================================================================

    - name: Verify /etc/shadow permissions
      ansible.builtin.stat:
        path: /etc/shadow
      register: shadow_stat

    - name: Check /etc/shadow permissions (0000)
      ansible.builtin.assert:
        that:
          - shadow_stat.stat.mode == '0000'
        fail_msg: /etc/shadow does not have mode 0000
        success_msg: /etc/shadow verified with correct permissions (0000)

    - name: Verify /etc/ssh directory permissions
      ansible.builtin.stat:
        path: /etc/ssh
      register: ssh_dir_stat

    - name: Check /etc/ssh permissions (0755)
      ansible.builtin.assert:
        that:
          - ssh_dir_stat.stat.mode == '0755'
        fail_msg: /etc/ssh does not have mode 0755
        success_msg: /etc/ssh verified with correct permissions (0755)

    - name: Verify /etc/sudoers permissions
      ansible.builtin.stat:
        path: /etc/sudoers
      register: sudoers_stat

    - name: Check /etc/sudoers permissions (0440)
      ansible.builtin.assert:
        that:
          - sudoers_stat.stat.mode == '0440'
        fail_msg: /etc/sudoers does not have mode 0440
        success_msg: /etc/sudoers verified with correct permissions (0440)

    # ========================================================================
    # AIDE Database Verification
    # ========================================================================

    - name: Verify AIDE database exists
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db
      register: aide_db_stat

    - name: Check AIDE database was initialized
      ansible.builtin.assert:
        that:
          - aide_db_stat.stat.exists
        fail_msg: AIDE database not initialized
        success_msg: AIDE database verified initialized

    # ========================================================================
    # Security Configuration Verification
    # ========================================================================

    - name: Verify umask configuration in /etc/profile
      ansible.builtin.command:
        cmd: grep "umask 0027" /etc/profile
      changed_when: false
      failed_when: false
      register: umask_profile_check

    - name: Check umask in /etc/profile
      ansible.builtin.assert:
        that:
          - umask_profile_check.rc == 0
        fail_msg: umask not configured in /etc/profile
        success_msg: umask verified in /etc/profile

    - name: Verify core dump restrictions
      ansible.builtin.command:
        cmd: grep "hard core 0" /etc/security/limits.conf
      changed_when: false
      failed_when: false
      register: core_dump_check

    - name: Check core dump restrictions
      ansible.builtin.assert:
        that:
          - core_dump_check.rc == 0
        fail_msg: Core dump restrictions not configured
        success_msg: Core dump restrictions verified configured
