[project]
name = "ansible-collection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "Carlos Meza", email = "carlos@digitalr00ts.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ansible-lint~=26.1",
  "molecule-plugins[docker,podman]~=25.8",
  "pytest-ansible~=26.1",
]

[dependency-groups]
build = [
  "tox-ansible>=26.1",
  "tox-uv>=1.29",
]

[tool.black]
line-length = 118

[tool.isort]
known_first_party = "ansible_collections.drts.ansible_collection"
line_length = 120
lines_after_imports = 2
lines_between_types = 1
profile = "black"

[tool.flake8]
max-line-length = 120

[tool.pytest]
ini_options.addopts = [ "-vvv", "-n", "2", "--log-level", "WARNING", "--color", "yes" ]
ini_options.filterwarnings = [ "ignore:AnsibleCollectionFinder has already been configured" ]
ini_options.testpaths = [ "tests" ]
